name: coursework-reproducibility

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python spacex_analysis.py --data data/launch_fixture.csv --output-dir /tmp/spacex-output
      - run: pytest -q
